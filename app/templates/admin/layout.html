<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-emerald-50 font-sans flex h-screen overflow-hidden">

    <aside class="w-64 bg-emerald-950 text-emerald-100 flex flex-col shadow-xl">
        <div class="p-6 border-b border-emerald-900 text-center">
            <h1 class="text-2xl font-bold text-emerald-400"><i class="fa-solid fa-shield-halved mr-2"></i>Admin CMS</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="{{ url_for('admin.dashboard') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-emerald-900 transition {% if request.endpoint == 'admin.dashboard' %}bg-emerald-800 text-emerald-300{% endif %}">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="{{ url_for('admin.manage_projects') }}" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-emerald-900 transition {% if 'project' in request.endpoint %}bg-emerald-800 text-emerald-300{% endif %}">
                <i class="fa-solid fa-folder-open"></i> Kelola Riset & Proyek
            </a>
        </nav>
        <div class="p-4 border-t border-emerald-900">
            <a href="/" target="_blank" class="block w-full text-center text-sm text-emerald-400 hover:text-emerald-200 mb-2">Lihat Web Publik</a>
            <a href="{{ url_for('admin.logout') }}" class="block w-full text-center bg-red-600 hover:bg-red-700 text-white py-2 rounded transition shadow-md">Logout</a>
        </div>
    </aside>

    <main class="flex-1 overflow-x-hidden overflow-y-auto">
        <div class="container mx-auto px-6 py-8">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-6 p-4 rounded-lg text-sm shadow-sm border-l-4 {% if category == 'success' %}bg-emerald-100 text-emerald-800 border-emerald-500{% else %}bg-red-100 text-red-800 border-red-500{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
