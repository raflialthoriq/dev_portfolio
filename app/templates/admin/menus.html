{% extends "admin/layout.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Manajemen Menu Navigasi</h2>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 h-fit">
        <h3 class="text-lg font-semibold mb-4">Tambah Menu Baru</h3>
        <form action="{{ url_for('admin.add_menu') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Menu</label>
                <input type="text" name="name" required placeholder="Cth: Tentang Saya" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">URL atau Slug</label>
                <input type="text" name="url" required placeholder="Cth: /tentang-saya" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition">Simpan Menu</button>
        </form>
    </div>

    <div class="lg:col-span-2 bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
        <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-600">
                <tr>
                    <th class="px-6 py-3 text-sm font-semibold">Nama Menu</th>
                    <th class="px-6 py-3 text-sm font-semibold">URL/Link</th>
                    <th class="px-6 py-3 text-sm font-semibold text-center">Urutan</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {% for menu in menus %}
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 font-medium text-gray-800">{{ menu.name }}</td>
                    <td class="px-6 py-4 text-gray-500 text-sm">{{ menu.url }}</td>
                    <td class="px-6 py-4 text-center text-gray-500">{{ menu.position }}</td>
                </tr>
                {% else %}
                <tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">Belum ada menu.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
