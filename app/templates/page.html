<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - DevPortofolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans leading-relaxed tracking-wide">
    
    <nav class="bg-gray-800 p-4 shadow-lg sticky top-0 z-50 border-b border-gray-700">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-400">&lt;/&gt; DevPortofolio</a>
            <ul class="flex space-x-6">
                {% for menu in menus %}
                    <li><a href="{{ menu.url }}" class="hover:text-blue-400 transition">{{ menu.name }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </nav>

    <main class="container mx-auto mt-16 px-4 max-w-4xl">
        <h1 class="text-4xl font-bold text-white mb-8 border-b-2 border-blue-500 inline-block pb-2">{{ page.title }}</h1>
        
        <div class="prose prose-invert prose-lg text-gray-300">
            {{ page.content | safe }}
        </div>
    </main>

    <footer class="mt-24 border-t border-gray-800 py-8 text-center text-gray-500">
        <p>&copy; 2026. DevPortofolio.</p>
    </footer>
</body>
</html>
